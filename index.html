<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<title>星星語言樂園</title>
<meta name="description" content="給小朋友的中英文互動學習遊戲">
<meta name="theme-color" content="#9B7EDE">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="語言樂園">
<style>
@import url('https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;700&family=ZCOOL+KuaiLe&family=Quicksand:wght@500;600;700&family=Noto+Sans+TC:wght@500;700&display=swap');

:root{
  --sky:#EAF6FF;
  --sun:#FFC93C;
  --coral:#FF6F61;
  --grape:#9B7EDE;
  --leaf:#4CAF83;
  --ink:#2B2140;
  --card:#FFFFFF;
  --red:#FF5A5A;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;background:var(--sky);min-height:100vh;}
body{font-family:'Noto Sans TC','Quicksand',sans-serif;color:var(--ink);}
.app{
  background:var(--sky);
  padding:14px 14px 40px;
  max-width:720px;
  margin:0 auto;
  min-height:100vh;
}
.hidden{display:none !important;}
.topbar{
  display:flex;align-items:center;justify-content:space-between;
  margin-bottom:14px;padding-top:6px;
}
.icon-btn{
  background:var(--card);border:none;border-radius:16px;
  width:44px;height:44px;font-size:20px;cursor:pointer;
  box-shadow:0 3px 0 rgba(43,33,64,0.15);
}
.icon-btn:active{transform:translateY(2px);box-shadow:none;}
.brand{
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;
  display:flex;align-items:center;gap:6px;
}
.stars-pill{
  background:var(--card);border-radius:20px;padding:8px 14px;
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:15px;
  box-shadow:0 3px 0 rgba(43,33,64,0.1);
  transition:transform .25s;
}
.stars-pill.burst{transform:scale(1.25);}
.hero-title{
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:26px;
  text-align:center;margin:18px 0 4px;
}
.hero-sub{text-align:center;color:#6a5f80;margin:0 0 20px;font-size:15px;font-weight:600;}
.profile-grid{display:grid;grid-template-columns:1fr 1fr;gap:16px;max-width:480px;margin:0 auto;}
.profile-card,.mode-card,.category-card{
  background:var(--card);border:none;border-radius:22px;padding:22px 12px;
  display:flex;flex-direction:column;align-items:center;gap:8px;cursor:pointer;
  box-shadow:0 5px 0 rgba(43,33,64,0.15);
  transition:transform .15s;
  font-family:'Quicksand',sans-serif;font-weight:700;font-size:15px;color:var(--ink);
}
.profile-card:hover,.mode-card:hover,.category-card:hover{transform:translateY(-3px);}
.profile-card:active,.mode-card:active,.category-card:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(43,33,64,0.15);}
.profile-emoji,.mode-emoji{font-size:46px;}
.category-emoji{font-size:38px;}
.section-title{
  font-family:'Baloo 2',sans-serif;font-weight:700;font-size:20px;
  text-align:center;margin:6px 0 16px;
}
.lang-toggle{display:flex;justify-content:center;gap:10px;margin-bottom:18px;}
.lang-btn{
  border:none;border-radius:18px;padding:10px 22px;font-weight:700;font-size:15px;
  background:var(--card);color:var(--ink);cursor:pointer;
  box-shadow:0 3px 0 rgba(43,33,64,0.12);
}
.lang-btn.active{background:var(--grape);color:#fff;}
.mode-grid,.category-grid{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;
}
.back-btn{
  background:none;border:none;color:var(--ink);font-weight:700;font-size:14px;
  cursor:pointer;margin-bottom:6px;padding:6px 0;
}
.flash-wrap{display:flex;align-items:center;justify-content:center;gap:14px;margin-top:10px;}
.nav-btn{
  background:var(--card);border:none;border-radius:50%;width:48px;height:48px;
  font-size:22px;cursor:pointer;box-shadow:0 3px 0 rgba(43,33,64,0.15);flex:none;
}
.flashcard{
  background:var(--card);border-radius:26px;padding:30px 20px;width:260px;min-height:260px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;
  box-shadow:0 6px 0 rgba(43,33,64,0.15);text-align:center;
}
.flashcard.pop{animation:popIn .35s ease;}
@keyframes popIn{0%{transform:scale(.85);opacity:0;}100%{transform:scale(1);opacity:1;}}
.flash-emoji{font-size:64px;}
.flash-word{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:26px;}
.flash-pinyin{font-family:'ZCOOL KuaiLe',sans-serif;font-size:16px;color:#6a5f80;}
.speak-btn{
  background:var(--sun);border:none;border-radius:16px;padding:8px 14px;
  font-size:18px;cursor:pointer;margin-top:4px;box-shadow:0 3px 0 rgba(43,33,64,0.12);
}
.speak-btn:disabled{opacity:.4;cursor:default;}
.record-row{display:flex;gap:8px;margin-top:8px;justify-content:center;flex-wrap:wrap;}
.record-row .speak-btn{font-size:14px;padding:8px 12px;}
.speak-btn.recording{background:var(--red);color:#fff;animation:pulse 1s infinite;}
@keyframes pulse{0%,100%{opacity:1;}50%{opacity:.55;}}
.dots{display:flex;justify-content:center;gap:6px;margin:16px 0;}
.dot{width:9px;height:9px;border-radius:50%;background:#cfc6e6;}
.dot.active{background:var(--grape);}
.finish-btn{
  display:block;margin:0 auto;background:var(--leaf);color:#fff;border:none;
  border-radius:20px;padding:12px 24px;font-weight:700;font-size:15px;cursor:pointer;
  box-shadow:0 4px 0 rgba(43,33,64,0.15);font-family:'Baloo 2',sans-serif;
}
.match-grid{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:10px;margin-top:6px;
}
.match-card{
  background:var(--card);border:none;border-radius:16px;padding:14px 6px;min-height:64px;
  font-size:16px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 rgba(43,33,64,0.15);
  display:flex;align-items:center;justify-content:center;text-align:center;
}
.match-card.word{font-size:14px;font-family:'Quicksand',sans-serif;}
.match-card.selected{background:var(--sun);}
.match-card.matched{background:var(--leaf);color:#fff;opacity:.55;box-shadow:none;}
.match-card.wrong{background:var(--red);color:#fff;}
.match-card:disabled{cursor:default;}
.spell-hint{display:flex;align-items:center;justify-content:center;gap:14px;margin:10px 0 22px;}
.spell-emoji{font-size:54px;}
.spell-slots{display:flex;justify-content:center;gap:10px;margin-bottom:22px;transition:transform .1s;}
.spell-slots.wrong{animation:shake .4s;}
.spell-slots.correct .spell-slot{background:var(--leaf);color:#fff;}
@keyframes shake{0%,100%{transform:translateX(0);}25%{transform:translateX(-8px);}75%{transform:translateX(8px);}}
.spell-slot{
  width:52px;height:52px;border-radius:14px;background:var(--card);
  display:flex;align-items:center;justify-content:center;font-size:22px;font-weight:700;
  box-shadow:inset 0 0 0 2px #cfc6e6;cursor:pointer;
}
.spell-slot.filled{box-shadow:inset 0 0 0 2px var(--grape);}
.spell-tray{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;}
.spell-tile{
  width:52px;height:52px;border-radius:14px;background:var(--sun);border:none;
  font-size:22px;font-weight:700;cursor:pointer;box-shadow:0 3px 0 rgba(43,33,64,0.15);
}
.spell-tile.used{visibility:hidden;}
.celebrate{
  position:fixed;inset:0;background:rgba(43,33,64,0.45);
  display:flex;align-items:center;justify-content:center;z-index:50;
}
.celebrate-card{
  background:var(--card);border-radius:24px;padding:30px;text-align:center;max-width:280px;
}
.celebrate-emoji{font-size:48px;}
.celebrate-text{font-family:'Baloo 2',sans-serif;font-weight:700;font-size:18px;margin:10px 0 18px;}
.btn-primary{
  background:var(--coral);color:#fff;border:none;border-radius:18px;padding:12px 26px;
  font-weight:700;font-size:15px;cursor:pointer;box-shadow:0 4px 0 rgba(43,33,64,0.15);
  font-family:'Baloo 2',sans-serif;
}
@media(prefers-reduced-motion:reduce){.flashcard.pop,.stars-pill.burst,.spell-slots.wrong{animation:none;}}
button:focus-visible{outline:3px solid var(--grape);outline-offset:2px;}
</style>
</head>
<body>

<div class="app">
  <div class="topbar">
    <button class="icon-btn" id="btnHome" aria-label="回首頁">🏠</button>
    <div class="brand"><span>🌟</span>星星語言樂園</div>
    <div style="display:flex;align-items:center;gap:8px;">
      <button class="icon-btn" id="btnVoice" aria-label="語音設定">🗣️</button>
      <div class="stars-pill" id="starsPill">⭐ <span id="starCount">0</span></div>
    </div>
  </div>

  <section id="screen-profile" class="screen">
    <h1 class="hero-title">歡迎來到語言樂園！</h1>
    <p class="hero-sub">選擇小朋友，開始今天的學習冒險吧</p>
    <div class="profile-grid">
      <button class="profile-card" data-age="4"><span class="profile-emoji">🧸</span>4歲・幼幼班</button>
      <button class="profile-card" data-age="6"><span class="profile-emoji">🎒</span>6歲・小一</button>
    </div>
  </section>

  <section id="screen-subject" class="screen hidden">
    <button class="back-btn" id="btnBackFromSubject">← 返回</button>
    <h2 class="section-title">今天想學什麼呢？</h2>
    <div class="profile-grid" style="max-width:480px;">
      <button class="profile-card" id="btnSubjectLang"><span class="profile-emoji">🗣️</span>語言學習</button>
      <button class="profile-card" id="btnSubjectMath"><span class="profile-emoji">🔢</span>數學遊戲</button>
    </div>
  </section>

  <section id="screen-mathmenu" class="screen hidden">
    <button class="back-btn" id="btnBackFromMathMenu">← 返回</button>
    <h2 class="section-title" id="mathMenuTitle"></h2>
    <div class="mode-grid" id="mathModeGrid"></div>
  </section>

  <section id="screen-count" class="screen hidden">
    <button class="back-btn" id="btnBackFromCount">← 返回</button>
    <h2 class="section-title">數一數，有幾個呢？</h2>
    <div class="flashcard" id="countCard" style="width:280px;min-height:auto;padding:24px;margin:0 auto;">
      <div id="countObjects" style="font-size:34px;line-height:1.3;letter-spacing:4px;text-align:center;"></div>
    </div>
    <div class="mode-grid" id="countChoices" style="max-width:360px;margin:18px auto 0;grid-template-columns:repeat(3,1fr);"></div>
    <div class="dots" id="countDots"></div>
  </section>

  <section id="screen-compare" class="screen hidden">
    <button class="back-btn" id="btnBackFromCompare">← 返回</button>
    <h2 class="section-title">哪一邊比較多？</h2>
    <div style="display:flex;gap:14px;justify-content:center;margin-top:10px;">
      <button class="flashcard" id="compareLeft" style="width:150px;min-height:150px;padding:16px;cursor:pointer;"></button>
      <button class="flashcard" id="compareRight" style="width:150px;min-height:150px;padding:16px;cursor:pointer;"></button>
    </div>
    <div class="dots" id="compareDots"></div>
  </section>

  <section id="screen-arith" class="screen hidden">
    <button class="back-btn" id="btnBackFromArith">← 返回</button>
    <h2 class="section-title" id="arithTitle"></h2>
    <div class="spell-hint"><span id="arithEquation" style="font-family:'Baloo 2',sans-serif;font-size:30px;font-weight:700;"></span></div>
    <div class="spell-slots" id="arithSlots"></div>
    <div class="spell-tray" id="arithTray"></div>
    <div class="dots" id="arithDots"></div>
  </section>

  <section id="screen-comparenum" class="screen hidden">
    <button class="back-btn" id="btnBackFromCompareNum">← 返回</button>
    <h2 class="section-title">哪一個符號才對？</h2>
    <div class="spell-hint"><span id="compareNumEquation" style="font-family:'Baloo 2',sans-serif;font-size:34px;font-weight:700;"></span></div>
    <div class="mode-grid" id="compareNumChoices" style="max-width:340px;margin:14px auto 0;grid-template-columns:repeat(3,1fr);"></div>
    <div class="dots" id="compareNumDots"></div>
  </section>

  <section id="screen-menu" class="screen hidden">
    <button class="back-btn" id="btnBackToSubjectFromMenu">← 返回</button>
    <h2 class="section-title" id="menuTitle"></h2>
    <div class="lang-toggle">
      <button class="lang-btn" data-lang="zh">中文</button>
      <button class="lang-btn" data-lang="en">English</button>
    </div>
    <div class="mode-grid" id="modeGrid"></div>
  </section>

  <section id="screen-category" class="screen hidden">
    <button class="back-btn" id="btnBackToMenu">← 返回</button>
    <h2 class="section-title" id="categoryTitle"></h2>
    <div class="category-grid" id="categoryGrid"></div>
  </section>

  <section id="screen-flashcard" class="screen hidden">
    <button class="back-btn" id="btnBackFromFlash">← 返回</button>
    <h2 class="section-title" id="flashCategoryTitle"></h2>
    <div class="flash-wrap">
      <button class="nav-btn" id="flashPrev" aria-label="上一張">‹</button>
      <div class="flashcard" id="flashCard">
        <div class="flash-emoji" id="flashEmoji"></div>
        <div class="flash-word" id="flashWord"></div>
        <div class="flash-pinyin" id="flashPinyin"></div>
        <button class="speak-btn" id="flashSpeak">🔊 唸一次</button>
        <div class="record-row">
          <button class="speak-btn" id="flashRecordBtn">🎤 錄音</button>
          <button class="speak-btn" id="flashPlayBtn" disabled>▶️ 播放</button>
        </div>
      </div>
      <button class="nav-btn" id="flashNext" aria-label="下一張">›</button>
    </div>
    <div class="dots" id="flashDots"></div>
    <button class="finish-btn" id="flashFinish">🌟 我學會了！</button>
  </section>

  <section id="screen-match" class="screen hidden">
    <button class="back-btn" id="btnBackFromMatch">← 返回</button>
    <h2 class="section-title" id="matchCategoryTitle"></h2>
    <p style="text-align:center;color:#6a5f80;font-weight:600;margin-top:-8px;">點一張圖片卡，再點對應的文字卡</p>
    <div class="match-grid" id="matchGrid"></div>
  </section>

  <section id="screen-spell" class="screen hidden">
    <button class="back-btn" id="btnBackFromSpell">← 返回</button>
    <h2 class="section-title" id="spellCategoryTitle"></h2>
    <div class="spell-hint" id="spellHint"></div>
    <div class="spell-slots" id="spellSlots"></div>
    <div class="spell-tray" id="spellTray"></div>
  </section>

  <section id="screen-storylist" class="screen hidden">
    <button class="back-btn" id="btnBackFromStorylist">← 返回</button>
    <h2 class="section-title">選一個成語故事</h2>
    <div class="category-grid" id="storyListGrid"></div>
  </section>

  <section id="screen-story" class="screen hidden">
    <button class="back-btn" id="btnBackFromStory">← 返回</button>
    <div class="flash-wrap">
      <button class="nav-btn" id="storyPrev" aria-label="上一則">‹</button>
      <div class="flashcard" id="storyCard" style="width:300px;min-height:auto;padding:24px 20px;">
        <div class="flash-emoji" id="storyEmoji"></div>
        <div class="flash-word" id="storyTitle"></div>
        <div class="flash-pinyin" id="storyPinyin"></div>
        <p id="storyText" style="font-size:15px;line-height:1.8;margin:10px 0;text-align:left;"></p>
        <button class="speak-btn" id="storySpeak">🔊 唸故事</button>
        <div class="record-row">
          <button class="speak-btn" id="storyRecordBtn">🎤 錄音</button>
          <button class="speak-btn" id="storyPlayBtn" disabled>▶️ 播放</button>
        </div>
        <div id="storyQuiz" style="margin-top:16px;width:100%;"></div>
      </div>
      <button class="nav-btn" id="storyNext" aria-label="下一則">›</button>
    </div>
  </section>
</div>

<div id="celebrate" class="celebrate hidden">
  <div class="celebrate-card">
    <div class="celebrate-emoji">🎉</div>
    <div class="celebrate-text" id="celebrateText"></div>
    <button class="btn-primary" id="celebrateClose">太棒了！</button>
  </div>
</div>

<div id="voiceModal" class="celebrate hidden">
  <div class="celebrate-card" style="max-width:320px;">
    <div class="celebrate-emoji">🗣️</div>
    <div class="celebrate-text">選擇發音音色</div>
    <p style="font-size:12.5px;color:#6a5f80;margin-top:-8px;">點一個試聽，選起來最自然的那個</p>
    <div id="voiceList" style="display:flex;flex-direction:column;gap:8px;max-height:240px;overflow-y:auto;margin:10px 0 16px;"></div>
    <button class="btn-primary" id="voiceModalClose">關閉</button>
  </div>
</div>

function shuffle(arr){
  const a = arr.slice();
  for(let i=a.length-1;i>0;i--){
    const j = Math.floor(Math.random()*(i+1));
    [a[i],a[j]] = [a[j],a[i]];
  }
  return a;
}
function randInt(min,max){ return Math.floor(Math.random()*(max-min+1))+min; }

// ---- Voice selection (prefer natural-sounding voices over robotic defaults) ----
let voicesCache = [];
const chosenVoice = { zh:null, en:null };

function scoreVoice(v){
  const n = (v.name||'').toLowerCase();
  let score = 0;
  if(n.includes('google')) score += 3;
  if(n.includes('enhanced') || n.includes('premium') || n.includes('neural')) score += 4;
  if(n.includes('siri')) score += 2;
  if(v.localService === false) score += 1;
  if(n.includes('compact')) score -= 3;
  return score;
}
function autoPickVoices(){
  const zhVoices = voicesCache.filter(v=> v.lang && v.lang.toLowerCase().startsWith('zh'));
  const enVoices = voicesCache.filter(v=> v.lang && v.lang.toLowerCase().startsWith('en'));
  if(zhVoices.length){ zhVoices.sort((a,b)=>scoreVoice(b)-scoreVoice(a)); if(!chosenVoice.zh) chosenVoice.zh = zhVoices[0]; }
  if(enVoices.length){ enVoices.sort((a,b)=>scoreVoice(b)-scoreVoice(a)); if(!chosenVoice.en) chosenVoice.en = enVoices[0]; }
}
function loadVoices(){
  voicesCache = speechSynthesis.getVoices();
  autoPickVoices();
}
if('speechSynthesis' in window){
  loadVoices();
  speechSynthesis.onvoiceschanged = loadVoices;
}

function speak(text, lang){
  try{
    if(!('speechSynthesis' in window)) return;
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === 'zh' ? 'zh-TW' : 'en-US';
    u.rate = 0.85;
    u.pitch = 1;
    const v = lang==='zh' ? chosenVoice.zh : chosenVoice.en;
    if(v) u.voice = v;
    speechSynthesis.cancel();
    speechSynthesis.speak(u);
  }catch(e){}
}

function renderVoiceList(){
  const lang = state.lang || 'zh';
  const list = voicesCache.filter(v=> v.lang && v.lang.toLowerCase().startsWith(lang==='zh'?'zh':'en'));
  const container = $('#voiceList');
  container.innerHTML='';
  if(list.length===0){
    container.innerHTML = '<p style="font-size:13px;color:#6a5f80;">這台裝置目前偵測不到'+(lang==='zh'?'中文':'英文')+'語音，建議到系統設定下載語音包。</p>';
    return;
  }
  list.sort((a,b)=>scoreVoice(b)-scoreVoice(a));
  list.forEach(v=>{
    const b=document.createElement('button');
    b.className='mode-card';
    b.style.width='100%';b.style.padding='10px';b.style.fontSize='13px';
    b.style.flexDirection='row';b.style.justifyContent='space-between';b.style.textAlign='left';
    const active = chosenVoice[lang] === v;

}

const recordings = {};
function initRecordControls(recordBtn, playBtn, getKey){
  let recorder=null, chunks=[], recording=false, stream=null;
  recordBtn.addEventListener('click', async ()=>{
    if(recording){ recorder.stop(); return; }
    if(!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia){
      alert('這個瀏覽器不支援錄音功能。');
      return;
    }
    try{
      stream = await navigator.mediaDevices.getUserMedia({audio:true});
    }catch(err){
      alert('無法使用麥克風，請確認已允許麥克風權限，且網址是 https 開頭（或 localhost）。');
      return;
    }
    chunks=[];
    try{
      recorder = new MediaRecorder(stream);
    }catch(err){
      alert('這個瀏覽器不支援錄音功能。');
      stream.getTracks().forEach(t=>t.stop());
      return;
    }
    recorder.ondataavailable = e=>{ if(e.data && e.data.size>0) chunks.push(e.data); };
    recorder.onstop = ()=>{
      const type = recorder.mimeType || 'audio/webm';
      const blob = new Blob(chunks, {type});
      const key = getKey();
      if(recordings[key]) URL.revokeObjectURL(recordings[key]);
      recordings[key] = URL.createObjectURL(blob);
      playBtn.disabled = false;
      recordBtn.textContent = '🎤 錄音';
      recordBtn.classList.remove('recording');
      recording = false;
      stream.getTracks().forEach(t=>t.stop());
    };
    recorder.start();
    recording = true;
    recordBtn.textContent = '⏹️ 停止錄音';
    recordBtn.classList.add('recording');
  });
  playBtn.addEventListener('click', ()=>{
    const key = getKey();
    if(recordings[key]) new Audio(recordings[key]).play();
  });
}
function refreshRecordUI(recordBtn, playBtn, key){
  recordBtn.textContent = '🎤 錄音';
  recordBtn.classList.remove('recording');
  playBtn.disabled = !recordings[key];
}

let matchState = { cards:[], selected:null, matchedCount:0, total:0 };
function startMatch(){
  const items = DATA[state.lang][state.profile][state.category];
  const n = Math.min(items.length, 6);
  const chosen = shuffle(items).slice(0, n);
  let cards=[];
  chosen.forEach((item, idx)=>{
    cards.push({key:idx, type:'e', display:item.e, matched:false});
    cards.push({key:idx, type:'w', display:item.w + (item.p ? (' '+item.p) : ''), matched:false});
  });
  cards = shuffle(cards);
  matchState = { cards, selected:null, matchedCount:0, total:chosen.length };
  $('#matchCategoryTitle').textContent = CATLABELS[state.lang][state.category] || state.category;
  renderMatchGrid();
  showScreen('screen-match');
}
function renderMatchGrid(){
  const grid = $('#matchGrid');
  grid.innerHTML='';
  matchState.cards.forEach((c,i)=>{
    const btn = document.createElement('button');
    btn.className = 'match-card' + (c.matched?' matched':'') + (c.type==='w'?' word':'');
    btn.textContent = c.display;
    btn.disabled = c.matched;
    btn.addEventListener('click', ()=> onMatchClick(i));
    grid.appendChild(btn);
  });
}
function onMatchClick(i){
  const card = matchState.cards[i];
  if(card.matched) return;
  const grid = $('#matchGrid');
  if(matchState.selected===null){
    matchState.selected=i;
    grid.children[i].classList.add('selected');
    return;
  }
  if(matchState.selected===i){
    grid.children[i].classList.remove('selected');
    matchState.selected=null;
    return;
  }
  const first = matchState.cards[matchState.selected];
  const second = card;
  if(first.key===second.key && first.type!==second.type){
    first.matched=true; second.matched=true;
    matchState.matchedCount++;
    addStars(1);
    const finishedAll = matchState.matchedCount===matchState.total;
    matchState.selected=null;
    renderMatchGrid();
    if(finishedAll){
      setTimeout(()=> showCelebrate('全部配對成功！'), 400);
    }
  } else {
    grid.children[matchState.selected].classList.add('wrong');
    grid.children[i].classList.add('wrong');
    const selIdx = matchState.selected;
    setTimeout(()=>{
      const g = $('#matchGrid');
      if(g.children[selIdx]) g.children[selIdx].classList.remove('selected','wrong');
      if(g.children[i]) g.children[i].classList.remove('wrong');
      matchState.selected=null;
    }, 700);
  }
}

let spellState = { items:[], index:0, target:[], slots:[], tray:[] };
function startSpell(){
  const items = DATA[state.lang][state.profile][state.category];
  spellState.items = shuffle(items);
  spellState.index = 0;
  $('#spellCategoryTitle').textContent = CATLABELS[state.lang][state.category] || state.category;
  loadSpellWord();
  showScreen('screen-spell');
}
function loadSpellWord(){
  const item = spellState.items[spellState.index];
  const chars = state.lang==='zh' ? Array.from(item.w) : item.w.toUpperCase().split('');
  spellState.target = chars;
  spellState.slots = new Array(chars.length).fill(null);
  spellState.tray = shuffle(chars.map((c,i)=>({char:c, used:false, id:i})));
  const hint = $('#spellHint');
  hint.innerHTML = '<span class="spell-emoji">'+item.e+'</span><button class="speak-btn" id="spellSpeak">🔊 唸一次</button>';
  $('#spellSpeak').addEventListener('click', ()=> speak(item.w, state.lang));
  renderSpell();
  speak(item.w, state.lang);
}
function renderSpell(){
  const slotsEl = $('#spellSlots');
  slotsEl.innerHTML='';
  spellState.slots.forEach((val,i)=>{
    const d=document.createElement('div');
    d.className='spell-slot'+(val!==null?' filled':'');
    d.textContent = val!==null ? (spellState.tray.find(t=>t.id===val)||{}).char||'' : '';
    d.addEventListener('click', ()=>{
      if(spellState.slots[i]!==null){
        const tid = spellState.slots[i];
        const t = spellState.tray.find(t=>t.id===tid);
        if(t) t.used=false;
        spellState.slots[i]=null;
        renderSpell();
      }
    });
    slotsEl.appendChild(d);
  });
  const tray = $('#spellTray');
  tray.innerHTML='';
  spellState.tray.forEach(t=>{
    const b=document.createElement('button');
    b.className='spell-tile'+(t.used?' used':'');
    b.textContent=t.char;
    b.disabled=t.used;
    b.addEventListener('click', ()=> onTileClick(t.id));
    tray.appendChild(b);
  });
}
function onTileClick(tileId){
  const tile = spellState.tray.find(t=>t.id===tileId);
  if(!tile || tile.used) return;
  const emptyIndex = spellState.slots.findIndex(s=>s===null);
  if(emptyIndex===-1) return;
  tile.used=true;
  spellState.slots[emptyIndex]=tileId;
  renderSpell();
  checkSpellComplete();
}
function checkSpellComplete(){
  if(spellState.slots.every(s=>s!==null)){
    const attempt = spellState.slots.map(id=> (spellState.tray.find(t=>t.id===id)||{}).char||'').join('');
    const target = spellState.target.join('');
    const slotsEl = $('#spellSlots');
    if(attempt===target){
      addStars(1);
      slotsEl.classList.add('correct');
      setTimeout(()=>{
        slotsEl.classList.remove('correct');
        spellState.index++;
        if(spellState.index >= spellState.items.length){
          showCelebrate('全部完成，你好棒！');
        } else {
          loadSpellWord();
        }
      }, 900);
    } else {
      slotsEl.classList.add('wrong');
      setTimeout(()=>{
        slotsEl.classList.remove('wrong');
        spellState.tray.forEach(t=>t.used=false);
        spellState.slots = new Array(spellState.target.length).fill(null);
        renderSpell();
      }, 800);
    }
  }
}

function renderStoryQuiz(item){

function onQuizAnswer(i, item, btnEl){

$('#storyNext').addEventListener('click', ()=>{

// ---- Math: menu ----
function openMathMenu(){
  $('#mathMenuTitle').textContent = state.profile + '歲小朋友的數學遊戲';
  const modes = state.profile===4 ? [
    {id:'count', label:'數一數', emoji:'🔢'},
    {id:'compareQty', label:'比大小', emoji:'⚖️'},
    {id:'shapes', label:'認識形狀', emoji:'🔺'}
  ] : [
    {id:'add', label:'加法練習', emoji:'➕'},
    {id:'sub', label:'減法練習', emoji:'➖'},
    {id:'compareNum', label:'數字比大小', emoji:'🔍'}
  ];
  const grid = $('#mathModeGrid');
  grid.innerHTML='';
  modes.forEach(m=>{
    const btn=document.createElement('button');
    btn.className='mode-card';
    btn.innerHTML='<span class="mode-emoji">'+m.emoji+'</span>'+m.label;
    btn.addEventListener('click', ()=> startMathMode(m.id));
    grid.appendChild(btn);
  });
  showScreen('screen-mathmenu');
}
function startMathMode(id){
  state.mode = 'math_'+id;
  if(id==='count') startCounting();
  else if(id==='compareQty') startCompareQty();
  else if(id==='shapes') startShapesFlashcard();
  else if(id==='add') startArithmetic('add');
  else if(id==='sub') startArithmetic('sub');
  else if(id==='compareNum') startCompareNum();
}

// ---- Math: counting ----
let countState = { round:0, total:8, answer:0 };
function startCounting(){
  countState = { round:0, total:8, answer:0 };
  renderCountDots();
  nextCountRound();
  showScreen('screen-count');
}
function renderCountDots(){
  const dots=$('#countDots'); dots.innerHTML='';
  for(let i=0;i<countState.total;i++){ const d=document.createElement('span'); d.className='dot'; dots.appendChild(d); }
  updateCountDots();
}
function updateCountDots(){ $all('#countDots .dot').forEach((d,i)=> d.classList.toggle('active', i===countState.round)); }
function nextCountRound(){
  const emoji = COUNT_EMOJI[randInt(0,COUNT_EMOJI.length-1)];
  const n = randInt(2,10);
  countState.answer = n;
  $('#countObjects').textContent = emoji.repeat(n);
  updateCountDots();
  const choices = new Set([n]);
  while(choices.size<3){ choices.add(randInt(2,10)); }
  const arr = shuffle([...choices]);
  const grid = $('#countChoices'); grid.innerHTML='';
  arr.forEach(num=>{
    const b=document.createElement('button');
    b.className='mode-card'; b.style.fontSize='22px'; b.style.padding='16px';
    b.textContent=num;
    b.addEventListener('click', ()=> onCountAnswer(num,b));
    grid.appendChild(b);
  });
}
function onCountAnswer(num, btnEl){
  if(num===countState.answer){
    btnEl.style.background='var(--leaf)'; btnEl.style.color='#fff';
    addStars(1);
    setTimeout(()=>{
      btnEl.style.background=''; btnEl.style.color='';
      countState.round++;
      if(countState.round>=countState.total){ showCelebrate('數一數全部答對了！', openMathMenu); }
      else{ nextCountRound(); }
    }, 700);
  } else {
    btnEl.style.background='var(--red)'; btnEl.style.color='#fff';
    setTimeout(()=>{ btnEl.style.background=''; btnEl.style.color=''; }, 500);
  }
}
$('#btnBackFromCount').addEventListener('click', ()=> showScreen('screen-mathmenu'));

// ---- Math: compare quantities ----
let compareState = { round:0, total:6, left:0, right:0 };
function startCompareQty(){
  compareState = { round:0, total:6, left:0, right:0 };
  renderCompareDots();
  nextCompareRound();
  showScreen('screen-compare');
}
function renderCompareDots(){
  const dots=$('#compareDots'); dots.innerHTML='';
  for(let i=0;i<compareState.total;i++){ const d=document.createElement('span'); d.className='dot'; dots.appendChild(d); }
  updateCompareDots();
}
function updateCompareDots(){ $all('#compareDots .dot').forEach((d,i)=> d.classList.toggle('active', i===compareState.round)); }
function nextCompareRound(){
  let l=randInt(1,9), r=randInt(1,9);
  while(r===l){ r=randInt(1,9); }
  compareState.left=l; compareState.right=r;
  const emoji = COUNT_EMOJI[randInt(0,COUNT_EMOJI.length-1)];
  $('#compareLeft').textContent = emoji.repeat(l);
  $('#compareRight').textContent = emoji.repeat(r);
  $('#compareLeft').style.fontSize='24px';
  $('#compareRight').style.fontSize='24px';
  updateCompareDots();
}
function onCompareClick(side){
  const correct = compareState.left>compareState.right ? 'left' : 'right';
  const el = side==='left' ? $('#compareLeft') : $('#compareRight');
  if(side===correct){
    el.style.background='var(--leaf)';
    addStars(1);
    setTimeout(()=>{
      el.style.background='';
      compareState.round++;
      if(compareState.round>=compareState.total){ showCelebrate('比大小全部答對了！', openMathMenu); }
      else{ nextCompareRound(); }
    }, 700);
  } else {
    el.style.background='var(--red)';
    setTimeout(()=>{ el.style.background=''; }, 500);
  }
}
$('#compareLeft').addEventListener('click', ()=> onCompareClick('left'));
$('#compareRight').addEventListener('click', ()=> onCompareClick('right'));
$('#btnBackFromCompare').addEventListener('click', ()=> showScreen('screen-mathmenu'));

// ---- Math: addition / subtraction ----
let arithState = { op:'add', round:0, total:10, target:[], slots:[], tray:[] };
function genArithProblem(op){
  let a,b,answer;
  if(op==='add'){ a=randInt(1,10); b=randInt(1,10); answer=a+b; }
  else{ a=randInt(5,18); b=randInt(1,a); answer=a-b; }
  return {a,b,answer};
}
function startArithmetic(op){
  arithState = { op, round:0, total:10, target:[], slots:[], tray:[] };
  $('#arithTitle').textContent = op==='add' ? '加法練習' : '減法練習';
  renderArithDots();
  nextArithRound();
  showScreen('screen-arith');
}
function renderArithDots(){
  const dots=$('#arithDots'); dots.innerHTML='';
  for(let i=0;i<arithState.total;i++){ const d=document.createElement('span'); d.className='dot'; dots.appendChild(d); }
  updateArithDots();
}
function updateArithDots(){ $all('#arithDots .dot').forEach((d,i)=> d.classList.toggle('active', i===arithState.round)); }
function nextArithRound(){
  const p = genArithProblem(arithState.op);
  arithState.a=p.a; arithState.b=p.b; arithState.answer=p.answer;
  $('#arithEquation').textContent = p.a + (arithState.op==='add' ? ' + ' : ' − ') + p.b + ' = ?';
  const digits = String(p.answer).split('').map(Number);
  arithState.target = digits;
  arithState.slots = new Array(digits.length).fill(null);
  const extra = [];
  while(extra.length<4){ extra.push(randInt(0,9)); }
  const trayDigits = digits.concat(extra);
  arithState.tray = shuffle(trayDigits.map((d,i)=>({val:d, used:false, id:i})));
  updateArithDots();
  renderArith();
}
function renderArith(){
  const slotsEl=$('#arithSlots'); slotsEl.innerHTML='';
  arithState.slots.forEach((val,i)=>{
    const d=document.createElement('div');
    d.className='spell-slot'+(val!==null?' filled':'');
    d.textContent = val!==null ? ((arithState.tray.find(t=>t.id===val)||{}).val ?? '') : '';
    d.addEventListener('click', ()=>{
      if(arithState.slots[i]!==null){
        const tid=arithState.slots[i];
        const t=arithState.tray.find(t=>t.id===tid);
        if(t) t.used=false;
        arithState.slots[i]=null;
        renderArith();
      }
    });
    slotsEl.appendChild(d);
  });
  const trayEl=$('#arithTray'); trayEl.innerHTML='';
  arithState.tray.forEach(t=>{
    const b=document.createElement('button');
    b.className='spell-tile'+(t.used?' used':'');
    b.textContent=t.val;
    b.disabled=t.used;
    b.addEventListener('click', ()=> onArithTile(t.id));
    trayEl.appendChild(b);
  });
}
function onArithTile(id){
  const t=arithState.tray.find(t=>t.id===id);
  if(!t||t.used) return;
  const emptyIdx = arithState.slots.findIndex(s=>s===null);
  if(emptyIdx===-1) return;
  t.used=true;
  arithState.slots[emptyIdx]=id;
  renderArith();
  checkArithComplete();
}
function checkArithComplete(){
  if(arithState.slots.every(s=>s!==null)){
    const attempt = arithState.slots.map(id=> ((arithState.tray.find(t=>t.id===id)||{}).val ?? '')).join('');
    const target = arithState.target.join('');
    const slotsEl=$('#arithSlots');
    if(attempt===target){
      addStars(1);
      slotsEl.classList.add('correct');
      setTimeout(()=>{
        slotsEl.classList.remove('correct');
        arithState.round++;
        if(arithState.round>=arithState.total){
          showCelebrate((arithState.op==='add'?'加法':'減法')+'練習全部完成！', openMathMenu);
        } else { nextArithRound(); }
      }, 800);
    } else {
      slotsEl.classList.add('wrong');
      setTimeout(()=>{
        slotsEl.classList.remove('wrong');
        arithState.tray.forEach(t=>t.used=false);
        arithState.slots = new Array(arithState.target.length).fill(null);
        renderArith();
      }, 700);
    }
  }
}
$('#btnBackFromArith').addEventListener('click', ()=> showScreen('screen-mathmenu'));

// ---- Math: compare numbers ----
let compareNumState = { round:0, total:8, a:0, b:0, answer:'' };
function startCompareNum(){
  compareNumState = { round:0, total:8, a:0, b:0, answer:'' };
  renderCompareNumDots();
  nextCompareNumRound();
  showScreen('screen-comparenum');
}
function renderCompareNumDots(){
  const dots=$('#compareNumDots'); dots.innerHTML='';
  for(let i=0;i<compareNumState.total;i++){ const d=document.createElement('span'); d.className='dot'; dots.appendChild(d); }
  updateCompareNumDots();
}
function updateCompareNumDots(){ $all('#compareNumDots .dot').forEach((d,i)=> d.classList.toggle('active', i===compareNumState.round)); }
function nextCompareNumRound(){
  let a=randInt(1,30), b=randInt(1,30);
  if(Math.random()<0.25) b=a;
  compareNumState.a=a; compareNumState.b=b;
  compareNumState.answer = a>b ? '>' : (a<b ? '<' : '=');

  updateCompareNumDots();
  const grid=$('#compareNumChoices'); grid.innerHTML='';
  ['>','<','='].forEach(sym=>{
    const btn=document.createElement('button');
    btn.className='mode-card'; btn.style.fontSize='26px'; btn.style.padding='16px';
    btn.textContent=sym;
    btn.addEventListener('click', ()=> onCompareNumAnswer(sym, btn));
    grid.appendChild(btn);
  });
}
function onCompareNumAnswer(sym, btnEl){
  if(sym===compareNumState.answer){
    btnEl.style.background='var(--leaf)'; btnEl.style.color='#fff';
    addStars(1);
    setTimeout(()=>{
      btnEl.style.background=''; btnEl.style.color='';
      compareNumState.round++;
      if(compareNumState.round>=compareNumState.total){ showCelebrate('數字比大小全部答對了！', openMathMenu); }
      else{ nextCompareNumRound(); }
    }, 700);
  } else {
    btnEl.style.background='var(--red)'; btnEl.style.color='#fff';
    setTimeout(()=>{ btnEl.style.background=''; btnEl.style.color=''; }, 500);
  }
}
$('#btnBackFromCompareNum').addEventListener('click', ()=> showScreen('screen-mathmenu'));
